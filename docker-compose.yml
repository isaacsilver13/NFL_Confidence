services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nfl_confidence
      POSTGRES_PASSWORD: nfl_confidence
      POSTGRES_DB: nfl_confidence
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfl_confidence"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The same single container as production (docker/Dockerfile): API and built SPA on :8000.
  # For frontend work with hot reload, run `npm run dev` in frontend/ (Vite proxies /api to :8000).
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nfl_confidence:nfl_confidence@db:5432/nfl_confidence
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db_data:
