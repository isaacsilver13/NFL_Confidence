name: Scheduled tick

# Production scheduling is owned by cron-job.org. Retain this as a manual
# recovery/dev operation only; it must never create a second automatic schedule.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which app to tick
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  tick-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' 
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: scheduled-tick-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Tick dev
        run: bash .github/scripts/tick.sh
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL_DEV }}
          TICK_TOKEN: ${{ secrets.TICK_TOKEN_DEV }}

  tick-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' 
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: scheduled-tick-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Tick prod
        run: bash .github/scripts/tick.sh
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL_PROD }}
          TICK_TOKEN: ${{ secrets.TICK_TOKEN_PROD }}
