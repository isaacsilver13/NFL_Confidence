[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP017 (timezone.utc -> UTC) would rewrite ~120 lines for style only.
ignore = ["UP017"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/etc. in argument defaults is the standard,
# idiomatic pattern (not a mutable-default bug) — exempt it from B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
