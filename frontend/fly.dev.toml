app = "nfl-confidence-web-dev"
primary_region = "iad"

[build]
dockerfile = "../docker/Dockerfile.frontend"

[build.args]
VITE_API_URL = "/api/v1"
VITE_APP_ENV = "dev"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"

[[vm]]
memory = "256mb"
cpus = 1
cpu_kind = "shared"

[env]
API_UPSTREAM = "nfl-confidence-api-dev.fly.dev"
