<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Confidence Pool</title>
    <script>
      // Runs synchronously before first paint to avoid a flash of the wrong theme.
      // Keep this string literal in sync with ThemeProvider.tsx's THEME_STORAGE_KEY.
      if (localStorage.getItem('nfl-confidence:theme') !== 'light') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
